provider = "oidc"
provider_display_name = "LibreOne"
oidc_issuer_url = "https://one.libretexts.dev/cas/oidc"
client_id = "assessment-ai-dev"
redirect_url = "https://assess-ai.libretexts.dev/oauth2/callback"
scope = "openid profile email libretexts"
user_id_claim = "sub"
oidc_email_claim = "email"
oidc_enabled_signing_algs = ["RS256"]
code_challenge_method = "S256"
insecure_oidc_allow_unverified_email = false
insecure_oidc_skip_issuer_verification = false
insecure_oidc_skip_nonce = false
skip_oidc_discovery = false
email_domains = ["*"]
whitelist_domains = ["assess-ai.libretexts.dev"]
skip_provider_button = true
reverse_proxy = true
http_address = "0.0.0.0:4180"
upstreams = ["static://202"]
set_xauthrequest = true
set_authorization_header = false
set_basic_auth = false
pass_access_token = false
pass_authorization_header = false
pass_basic_auth = false
pass_user_headers = false
skip_auth_strip_headers = true
session_cookie_minimal = true
cookie_name = "__Host-assessment-ai"
cookie_path = "/"
cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"
# cookie_expire is an ABSOLUTE cap, not an idle timeout, and with cookie_refresh
# disabled it is the only thing bounding the session. At 15m a reviewer lost the
# session mid-review roughly twice per half hour; because a form POST is answered
# with a 302 the request body is discarded, so each expiry costs the pending
# decision. 2h is bounded by CAS's own idle TGT kill, so the app session can never
# outlive the IdP session that authorised it.
#
# Raising this further would need one of:
#   - cookie_refresh > 0, which oauth2-proxy rejects while session_cookie_minimal
#     is true (it needs the refresh token kept in the session), and which CAS does
#     not advertise offline_access for anyway; or
#   - accepting an app session that outlives the CAS session.
cookie_expire = "2h"
cookie_refresh = "0"
cookie_csrf_expire = "5m"
cookie_csrf_per_request = true
cookie_csrf_per_request_limit = 4
auth_logging = false
request_logging = false
show_debug_on_error = false
